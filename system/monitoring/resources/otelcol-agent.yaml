apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector

metadata:
  name: otelcol-agent

spec:
  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          - type: json_parser
            id: cnpg-json
            if: 'resource["k8s.namespace.name"] == "sophie" and resource["k8s.container.name"] == "postgres"'
            parse_from: body
            parse_to: attributes.cnpg
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.application_name != nil'
            from: attributes.cnpg.record.application_name
            to: attributes["db.client.application.name"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.database_name != nil'
            from: attributes.cnpg.record.database_name
            to: attributes["db.namespace"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.process_id != nil'
            from: attributes.cnpg.record.process_id
            to: attributes["db.postgresql.process.id"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.session_id != nil'
            from: attributes.cnpg.record.session_id
            to: attributes["db.postgresql.session.id"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.query_id != nil'
            from: attributes.cnpg.record.query_id
            to: attributes["db.postgresql.query.id"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.transaction_id != nil'
            from: attributes.cnpg.record.transaction_id
            to: attributes["db.postgresql.transaction.id"]
          - type: move
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.log_time != nil'
            from: attributes.cnpg.record.log_time
            to: attributes["db.postgresql.log.time"]
          - type: regex_parser
            id: cnpg-traceparent
            if: 'attributes.cnpg != nil and attributes.cnpg.record != nil and attributes.cnpg.record.statement != nil'
            parse_from: attributes.cnpg.record.statement
            regex: "traceparent='00-(?P<trace_id>[0-9a-f]{32})-(?P<span_id>[0-9a-f]{16})-(?P<trace_flags>[0-9a-f]{2})'"
            trace:
              trace_id:
                parse_from: attributes.trace_id
              span_id:
                parse_from: attributes.span_id
              trace_flags:
                parse_from: attributes.trace_flags
      hostmetrics:
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: ${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
      prometheus/self:
        config:
          scrape_configs:
            - job_name: opentelemetry-collector
              scrape_interval: 10s
              static_configs:
                - targets: ["0.0.0.0:8888"]

    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      k8sattributes:
        passthrough: true
      resourcedetection:
        detectors:
          - system
          - env
          - k8snode
        k8snode:
          node_from_env_var: K8S_NODE_NAME
        timeout: 5s
        override: false
      resource/append_otelcol_agent_pod_ip:
        attributes:
          - key: k8s.pod.ip
            action: insert
            value: ${env:MY_POD_IP}

    exporters:
      otlp_grpc:
        endpoint: otelcol-gateway-collector-headless.monitoring.svc.materia-cluster.ggrel.net:4317
        tls:
          insecure: true

    connectors:
      routing/metrics:
        table:
          - condition: "true"
            pipelines:
              - metrics

    service:
      pipelines:
        metrics/self:
          receivers:
            - prometheus/self
          processors:
            - resource/append_otelcol_agent_pod_ip
          exporters:
            - routing/metrics
        metrics:
          receivers:
            - routing/metrics
            - hostmetrics
            - kubeletstats
          processors:
            - k8sattributes
            - resourcedetection
            - memory_limiter
            - batch
          exporters:
            - otlp_grpc
        logs:
          receivers:
            - filelog
          processors:
            - k8sattributes
            - resourcedetection
            - memory_limiter
            - batch
          exporters:
            - otlp_grpc
  env:
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
  image: ghcr.io/rokoucha/otelcol/materia-agent:20260903.143203
  mode: daemonset
  replicas: 1
  serviceAccount: otelcol-agent-sa
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
    - name: varlogpods
      mountPath: /var/log/pods
  volumes:
    - name: hostfs
      hostPath:
        path: /
    - name: varlogpods
      hostPath:
        path: /var/log/pods
