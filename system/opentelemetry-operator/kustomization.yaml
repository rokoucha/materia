apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./resources/scoped-rbac.yaml
  - ./resources/network-policy.yaml
  - https://github.com/open-telemetry/opentelemetry-operator/releases/download/v0.161.0/opentelemetry-operator.yaml

patches:
  - target:
      kind: Deployment
      name: opentelemetry-operator-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=-operator.networkpolicy,-operand.networkpolicy
  - target:
      kind: Deployment
      name: opentelemetry-operator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opentelemetry-operator-controller-manager
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: manager
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
  - target:
      kind: Namespace
      name: opentelemetry-operator-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: opentelemetry-operator-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: v1.37
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: v1.37
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/audit-version: v1.37
  - target:
      kind: ClusterRole
      name: opentelemetry-operator-manager-role
    patch: |-
      - op: replace
        path: /rules
        value:
          - nonResourceURLs: [/version]
            verbs: [get]
          - apiGroups: [""]
            resources: [namespaces]
            verbs: [get, list, watch]
  - target:
      kind: Deployment
      name: opentelemetry-operator-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --watch-namespace=monitoring,otel-external
