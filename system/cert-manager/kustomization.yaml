apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./resources/network-policy.yaml
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
  - ./resources/cloudflare-api-token.yaml
  - ./resources/cluster-issuer.yaml
  - ./resources/monitor.yaml

patches:
  - target:
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers-only
  - target:
      kind: Namespace
      name: cert-manager
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: v1.37
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: v1.37
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/audit-version: v1.37
