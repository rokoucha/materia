apiVersion: apps/v1
kind: Deployment

metadata:
  name: argocd-redis

spec:
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        # The Redis password is managed by the 1Password Operator.
        - name: secret-init
          $patch: delete
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 768Mi
