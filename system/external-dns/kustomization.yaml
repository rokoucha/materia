apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: external-dns
    releaseName: external-dns
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: true
    valuesFile: ./values.yaml
  - name: external-dns
    releaseName: external-dns-lb-test-a
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-lb-test-a.yaml
  - name: external-dns
    releaseName: external-dns-lb-test-aaaa
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-lb-test.yaml
  - name: external-dns
    releaseName: external-dns-teamspeak-a
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-teamspeak-a.yaml
  - name: external-dns
    releaseName: external-dns-teamspeak-aaaa
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-teamspeak-aaaa.yaml
  - name: external-dns
    releaseName: external-dns-ingress-lb-a
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-ingress-lb-a.yaml
  - name: external-dns
    releaseName: external-dns-ingress-lb-aaaa
    namespace: external-dns
    version: 1.21.1
    repo: https://kubernetes-sigs.github.io/external-dns/
    includeCRDs: false
    valuesFile: ./values-ingress-lb-aaaa.yaml

resources:
  - ./resources/cloudflare-api-key.yaml
  - ./resources/monitor.yaml
  - ./resources/namespace.yaml

patches:
  - path: ./patches/cluster-role-binding.yaml
