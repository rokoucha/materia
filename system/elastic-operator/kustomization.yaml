apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: eck-operator
    releaseName: elastic-operator
    namespace: elastic-system
    version: 3.5.0
    repo: https://helm.elastic.co
    includeCRDs: true
    valuesInline:
      managedNamespaces:
        - mastodon
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault

resources:
  - ./resources/network-policy.yaml
  - ./resources/namespace.yaml
  - ./resources/scoped-rbac.yaml

patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: elastic-operator
    patch: |-
      - op: replace
        path: /rules
        value: [{"apiGroups": [""], "resources": ["namespaces"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["storage.k8s.io"], "resources": ["storageclasses"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["admissionregistration.k8s.io"], "resources": ["validatingwebhookconfigurations"], "verbs": ["get", "list", "watch", "create", "update", "patch", "delete"]}, {"apiGroups": [""], "resources": ["nodes"], "verbs": ["get", "list", "watch"]}]
