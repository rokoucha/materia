apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: eck-operator
    releaseName: elastic-operator
    namespace: elastic-system
    version: 3.5.0
    repo: https://helm.elastic.co
    includeCRDs: true
    valuesInline:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault

resources:
  - ./resources/network-policy.yaml
  - ./resources/namespace.yaml
