apiVersion: v1
kind: PersistentVolume
metadata:
  name: mastodon-elasticsearch-nfs
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  claimRef:
    name: elasticsearch-data-elasticsearch-es-default-0
    namespace: mastodon
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 172.16.2.17
    path: /volume1/k8s-mastodon-elasticsearch-sync
  persistentVolumeReclaimPolicy: Retain
  storageClassName: beryllium-nfs-sync
  volumeMode: Filesystem
