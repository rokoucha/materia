apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pd-proxy-trust
  namespace: mastodon
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [proxy-trust]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [mastodon-web, mastodon-streaming]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pd-proxy-trust
  namespace: mastodon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pd-proxy-trust
subjects:
  - kind: ServiceAccount
    name: pd-migration
    namespace: kube-system
