apiVersion: v1
kind: PersistentVolume
metadata:
  name: miniflux-postgresql-nfs
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  claimRef:
    name: postgresql-1
    namespace: miniflux
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 172.16.2.17
    path: /volume1/k8s-miniflux-postgresql-sync
  persistentVolumeReclaimPolicy: Retain
  storageClassName: beryllium-nfs-sync
  volumeMode: Filesystem
