apiVersion: ingress.v3.haproxy.org/v3
kind: ValidationRules

metadata:
  name: materia-annotations

spec:
  prefix: materia.ggrel.net
  validation_rules:
    forward-auth:
      section: backend
      type: bool
      rule: value == true
      template: |
        http-request lua.forward-auth
        http-request redirect code 302 location /outpost.goauthentik.io/start?rd=https%%3A%%2F%%2F%[req.hdr(host),url_enc]%[pathq,url_enc] if { var(txn.forward_auth_result) -m str unauthorized }
        http-request deny deny_status 403 if { var(txn.forward_auth_result) -m str forbidden }
        http-request deny deny_status 503 if { var(txn.forward_auth_result) -m str error }
        http-after-response add-header Set-Cookie %[var(txn.forward_auth_client_header_set_cookie)] if { var(txn.forward_auth_client_header_set_cookie) -m found }
    mcp-anonymous-challenge:
      section: backend
      type: bool
      rule: value == true
      template: |
        http-request return status 401 hdr WWW-Authenticate 'Bearer resource_metadata="https://h.rokoucha.net/.well-known/oauth-protected-resource"' if { path -m str /api/mcp } { req.hdr_cnt(authorization) eq 0 }
    normalize-rpc-path:
      # Normalize before forward-auth, matching the former snippet order.
      order_priority: 10
      section: backend
      type: bool
      rule: value == true
      template: |
        http-request set-path /rpc if { path -m str //rpc }
