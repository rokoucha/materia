controller:
  image:
    # renovate: image=ghcr.io/haproxytech/kubernetes-ingress
    tag: 3.4.0

  # Keep ingress available through a single-node failure.
  kind: DaemonSet

  # Restart pods alongside changes to the custom validation rules.
  podAnnotations: |
    materia.ggrel.net/validation-rules-revision: "3"

  extraArgs:
    - --custom-validation-rules=haproxy-controller/materia-annotations

  extraEnvs:
    - name: FORWARD_AUTH_URL
      value: http://127.0.0.1:10080/outpost.goauthentik.io/auth/nginx
    - name: FORWARD_AUTH_METHOD
      value: HEAD
    - name: FORWARD_AUTH_TIMEOUT_MS
      value: "12000"
    - name: FORWARD_AUTH_UPSTREAM_HEADERS
      value: x-authentik-username,x-authentik-groups,x-authentik-entitlements,x-authentik-email,x-authentik-name,x-authentik-uid,x-authentik-jwt,x-authentik-meta-jwks,x-authentik-meta-outpost,x-authentik-meta-provider,x-authentik-meta-app,x-authentik-meta-version
    - name: FORWARD_AUTH_CLIENT_HEADERS
      value: set-cookie

  ingressClassResource:
    default: true

  defaultTLSSecret:
    secretNamespace: haproxy-controller
    secret: materia-ggrel-net-tls

  config:
    ssl-redirect-port: "443"
    cr-global: haproxy-controller/materia
    response-set-header: |
      Strict-Transport-Security "max-age=31536000"
    quic-alt-svc-max-age: "86400"

  extraVolumeMounts:
    - name: forward-auth-lua
      mountPath: /etc/haproxy/forward-auth.lua
      subPath: forward-auth.lua
      readOnly: true

  extraVolumes:
    - name: forward-auth-lua
      configMap:
        name: haproxy-forward-auth-lua

  auxiliaryConfig: |
    global
      # The structured client-native model drops retries: 0 as an unset value.
      httpclient.retries 0

    listen materia_forward_auth_relay
      mode http
      bind 127.0.0.1:10080
      timeout connect 3s
      timeout client 15s
      timeout server 10s
      server outpost ak-outpost-authentik-embedded-outpost.authentik.svc.materia-cluster.ggrel.net:9000 init-addr last,libc,none

  service:
    nodePorts:
      http: 80
      https: 443
      quic: 443

    ports:
      http: 80
      https: 443
      quic: 443

    enablePorts:
      http: true
      https: true
      quic: true
      stat: false
      admin: false

    targetPorts:
      http: http
      https: https
      quic: quic

    ipFamilies:
      - IPv4
      - IPv6
    ipFamilyPolicy: RequireDualStack

  serviceMonitor:
    enabled: true
