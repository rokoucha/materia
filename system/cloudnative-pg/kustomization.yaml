---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- "./resources/scoped-rbac.yaml"
- "./resources/network-policy.yaml"
- "./resources/cloudnative-pg-monitor.yaml"
- https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.1/releases/cnpg-1.30.1.yaml
patches:
- target:
    kind: Namespace
    name: cnpg-system
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: cnpg-system
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.37
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.37
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.37
- target:
    kind: ClusterRole
    name: cnpg-manager
  patch: |
    ---
    - op: replace
      path: "/rules"
      value:
      - apiGroups:
        - ''
        resources:
        - nodes
        verbs:
        - get
        - list
        - watch
      - apiGroups:
        - admissionregistration.k8s.io
        resources:
        - mutatingwebhookconfigurations
        - validatingwebhookconfigurations
        verbs:
        - get
        - patch
      - apiGroups:
        - postgresql.cnpg.io
        resources:
        - clusterimagecatalogs
        verbs:
        - get
        - list
        - watch
- target:
    kind: Deployment
    name: cnpg-controller-manager
  patch: |
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cnpg-controller-manager
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: WATCH_NAMESPACE
              value: authentik,mastodon,miniflux,sophie
