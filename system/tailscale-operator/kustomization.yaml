apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

helmCharts:
  - name: tailscale-operator
    releaseName: tailscale-operator
    namespace: tailscale
    version: "1.104.1"
    repo: https://pkgs.tailscale.com/helmcharts
    includeCRDs: true
    valuesInline:
      operatorConfig:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        extraEnv:
          - name: XDG_CONFIG_HOME
            value: /tmp
          - name: XDG_CACHE_HOME
            value: /tmp

resources:
  - ./resources/network-policy.yaml
  - ./resources/namespace.yaml
  - ./resources/operator-oauth.yaml
