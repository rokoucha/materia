apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: intel-gpu-device-plugin

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-device-plugin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/i915
                    operator: Exists
      containers:
        - env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          image: docker.io/intel/intel-gpu-plugin:0.36.0
          imagePullPolicy: IfNotPresent
          name: intel-gpu-device-plugin
          resources:
            limits:
              cpu: 100m
              memory: 90Mi
            requests:
              cpu: 40m
              memory: 45Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /dev/dri
              name: devfs
              readOnly: true
            - mountPath: /sys/class/drm
              name: sysfs-drm
              readOnly: true
            - mountPath: /var/lib/kubelet/device-plugins
              name: kubelet-sockets
            - mountPath: /var/run/cdi
              name: cdi
      priorityClassName: system-node-critical
      volumes:
        - hostPath:
            path: /dev/dri
            type: Directory
          name: devfs
        - hostPath:
            path: /sys/class/drm
            type: Directory
          name: sysfs-drm
        - hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
          name: kubelet-sockets
        - hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
          name: cdi
