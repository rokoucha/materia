apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: descheduler

helmCharts:
  - name: descheduler
    releaseName: descheduler
    namespace: descheduler
    # Pinned below 0.36.0: that release reports zero node usage on the first
    # descheduling cycle, and a CronJob only ever runs one. See renovate.json.
    version: 0.35.1
    repo: https://kubernetes-sigs.github.io/descheduler/
    includeCRDs: true
    valuesFile: ./values.yaml

resources:
  - ./resources/namespace.yaml
