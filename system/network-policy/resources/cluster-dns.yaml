apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cluster-dns
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s:k8s-app: kube-dns
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/component: opentelemetry-collector
            k8s:app.kubernetes.io/instance: monitoring.otelcol-gateway
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
