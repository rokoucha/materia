apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - 1password
          - actions-runner
          - argocd
          - authentik
          - cert-manager
          - cloudflare-ddns
          - descheduler
          - docker-registry-secrets
          - elastic-system
          - external-dns
          - haproxy-controller
          - influxdb
          - kube-system
          - opentelemetry-operator-system
          - synology-csi
          - tailscale
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - {}
