apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: redis-operator
    releaseName: redis-operator
    namespace: redis-operator
    version: "0.27.0"
    repo: https://ot-container-kit.github.io/helm-charts
    includeCRDs: true
    valuesInline:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      featureGates:
        GenerateConfigInInitContainer: true

resources:
  - ./resources/network-policy.yaml
  - ./resources/namespace.yaml
  - ./resources/redis-operator-monitor.yaml
  - ./resources/scoped-rbac.yaml
