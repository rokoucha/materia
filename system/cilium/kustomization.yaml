apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./resources/cilium-lb-ipv6-pool-updater-rbac.yaml
  - ./resources/materia-public-ipv4.yaml
  - ./resources/l2-announcement-policy.yaml

helmCharts:
  - name: cilium
    releaseName: cilium
    namespace: kube-system
    version: 1.20.1
    repo: https://helm.cilium.io
    includeCRDs: true
    valuesFile: ./values.yaml
