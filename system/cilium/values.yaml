bgpControlPlane:
  enabled: false
cluster:
  name: materia-cluster
preferIpv6: true
hubble:
  peerService:
    clusterDomain: materia-cluster.ggrel.net
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      annotations:
        haproxy.org/ssl-redirect: "true"
      enabled: true
      className: haproxy
      hosts:
        - hubble.materia.ggrel.net
ipam:
  mode: multi-pool
  operator:
    autoCreateCiliumPodIPPools:
      default:
        ipv4:
          cidrs: [10.244.0.0/16]
          maskSize: 24
        ipv6:
          cidrs: [fd00::/108]
          maskSize: 120
egressMasqueradeInterfaces: enp+
podAnnotations:
  pd.materia.rokoucha.com/multi-pool: "true"
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
ipv4:
  enabled: true
ipv6:
  enabled: true
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
l2announcements:
  enabled: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
resources:
  requests:
    cpu: 150m
    memory: 768Mi
  limits:
    memory: 1Gi
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
operator:
  prometheus:
    metricsService: true
    serviceMonitor:
      enabled: true
      interval: 30s
      trustCRDsExist: true
  replicas: 1
prometheus:
  enabled: true
  metricsService: true
  serviceMonitor:
    enabled: true
    interval: 30s
    trustCRDsExist: true
rollOutCiliumPods: true
routingMode: tunnel
serviceAccounts:
  cilium:
    name: cilium
  operator:
    name: cilium-operator
tunnelProtocol: vxlan
upgradeCompatibility: "1.18"

secretsNamespaceLabels:
  pod-security.kubernetes.io/enforce: restricted
  pod-security.kubernetes.io/enforce-version: v1.37
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/warn-version: v1.37
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/audit-version: v1.37
