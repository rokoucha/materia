# Apply over values.yaml: operator first, agents remain on their existing config.
egressMasqueradeInterfaces: "enp+ ethSel0.30"
enableIPv6Masquerade: true
ipam:
  mode: multi-pool
  operator:
    autoCreateCiliumPodIPPools:
      default:
        ipv4:
          cidrs: [10.244.0.0/16]
          maskSize: 24
        ipv6:
          cidrs: [fd00::/108]
          maskSize: 120
extraConfig:
  enable-cluster-pool-to-multi-pool-migration: "true"
rollOutCiliumPods: false
operator:
  rollOutPods: true
