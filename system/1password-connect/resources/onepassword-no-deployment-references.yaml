---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: onepassword-no-deployment-references
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      scope: Namespaced
  variables: []
  validations:
  - expression: "!has(object.metadata.annotations) || !object.metadata.annotations.exists(k,
      k in ['operator.1password.io/item-path', 'operator.1password.io/item-name'])"
    message: Use an approved OnePasswordItem instead of Deployment item reference
      annotations
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: onepassword-no-deployment-references
spec:
  policyName: onepassword-no-deployment-references
  validationActions:
  - Warn
  - Audit
