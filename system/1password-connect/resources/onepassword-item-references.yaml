---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: onepassword-item-references
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - onepassword.com
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - onepassworditems
      scope: Namespaced
  variables:
  - name: references
    expression: |-
      {
        "argocd/argocd-github-app": [
          "vaults/ct5helkweamxgoqur2sfafw43u/items/bvyvg4wzv2s4k53ghnfebufzsa",
          "vaults/materia-system/items/argocd-github-app"
        ],
        "argocd/argocd-notifications-secret": [
          "vaults/materia/items/argocd-notifications-secret",
          "vaults/materia-system/items/argocd-notifications-secret"
        ],
        "argocd/argocd-redis": [
          "vaults/materia/items/argocd-redis",
          "vaults/materia-system/items/argocd-redis"
        ],
        "argocd/argocd-secret": [
          "vaults/materia/items/argocd-secret",
          "vaults/materia-system/items/argocd-secret"
        ],
        "authentik/authentik": [
          "vaults/materia/items/authentik-secrets",
          "vaults/materia-system/items/authentik-secrets"
        ],
        "cert-manager/cloudflare-api-token-secret": [
          "vaults/materia/items/certbot-cloudflare",
          "vaults/materia-system/items/certbot-cloudflare"
        ],
        "cloudflare-ddns/cloudflare-ddns-apitoken": [
          "vaults/materia/items/cloudflare-ddns",
          "vaults/materia-system/items/cloudflare-ddns"
        ],
        "cosense-cli-mcp/cosense-cli-mcp-secrets": [
          "vaults/materia/items/cosense-cli-mcp-secrets",
          "vaults/materia-applications/items/cosense-cli-mcp-secrets"
        ],
        "docker-registry-secrets/ghcr-credentials": [
          "vaults/materia/items/ghcr-credentials",
          "vaults/materia-system/items/ghcr-credentials"
        ],
        "external-dns/cloudflare-api-key": [
          "vaults/materia/items/external-dns-secrets",
          "vaults/materia-system/items/external-dns-secrets"
        ],
        "grafana/grafana-secrets": [
          "vaults/materia/items/grafana-secrets",
          "vaults/materia-applications/items/grafana-secrets"
        ],
        "mackerel-operator/mackerel-apikey": [
          "vaults/materia/items/mackerel-operator-apikey",
          "vaults/materia-system/items/mackerel-operator-apikey"
        ],
        "mahiron/mackerel-apikey": [
          "vaults/materia/items/mackerel-apikey",
          "vaults/materia-applications/items/mackerel-apikey"
        ],
        "mahiron/pix-smb400-gateway-auth": [
          "vaults/materia/items/pix-smb400-gateway-auth",
          "vaults/materia-applications/items/pix-smb400-gateway-auth"
        ],
        "mastodon/mastodon-secrets": [
          "vaults/materia/items/mastodon-secrets",
          "vaults/materia-applications/items/mastodon-secrets"
        ],
        "miniflux/miniflux-secrets": [
          "vaults/materia/items/miniflux-secrets",
          "vaults/materia-applications/items/miniflux-secrets"
        ],
        "mirakurun/mackerel-apikey": [
          "vaults/materia/items/mackerel-apikey",
          "vaults/materia-applications/items/mackerel-apikey"
        ],
        "mirakurun/mirakurun-config": [
          "vaults/materia/items/mirakurun-config",
          "vaults/materia-applications/items/mirakurun-config"
        ],
        "monitoring/mackerel-apikey": [
          "vaults/materia/items/mackerel-apikey",
          "vaults/materia-system/items/mackerel-apikey"
        ],
        "otel-external/mackerel-apikey": [
          "vaults/materia/items/mackerel-apikey",
          "vaults/materia-applications/items/mackerel-apikey"
        ],
        "otel-external/otelcol-external-token": [
          "vaults/materia/items/otelcol-external-token",
          "vaults/materia-applications/items/otelcol-external-token"
        ],
        "sophie/sophie-secrets": [
          "vaults/materia/items/sophie-secrets",
          "vaults/materia-applications/items/sophie-secrets"
        ],
        "switchbot-meter-exporter/switchbot-token": [
          "vaults/materia/items/switchbot-token",
          "vaults/materia-applications/items/switchbot-token"
        ],
        "synology-csi/client-info-secret": [
          "vaults/materia/items/synology-csi-client-info",
          "vaults/materia-system/items/synology-csi-client-info"
        ],
        "tailscale/operator-oauth": [
          "vaults/materia/items/tailscale-operator-oauth",
          "vaults/materia-system/items/tailscale-operator-oauth"
        ],
        "1password/onepassword-token": [
          "vaults/materia/items/onepassword-token"
        ],
        "1password/op-credentials": [
          "vaults/materia/items/op-credentials"
        ],
        "1password/op-credentials-system": [
          "vaults/materia-system/items/onepassword-system-credentials"
        ],
        "1password/onepassword-token-system": [
          "vaults/materia-system/items/onepassword-system-token"
        ],
        "1password-applications/op-credentials": [
          "vaults/materia-system/items/onepassword-applications-credentials"
        ],
        "1password-applications/onepassword-token": [
          "vaults/materia-system/items/onepassword-applications-token"
        ]
      }
  - name: key
    expression: object.metadata.namespace + '/' + object.metadata.name
  validations:
  - expression: |-
      (request.operation == 'UPDATE' && has(oldObject.metadata.deletionTimestamp) &&
       object.spec == oldObject.spec) ||
      (variables.key in variables.references && object.spec.itemPath in variables.references[variables.key])
    message: 1Password item reference is not approved for this namespace and resource
      name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: onepassword-item-references
spec:
  policyName: onepassword-item-references
  validationActions:
  - Deny
