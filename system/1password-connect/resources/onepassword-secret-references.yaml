---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: onepassword-secret-references
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  variables:
  - name: references
    expression: |-
      {
        "1password/onepassword-token": "vaults/materia/items/onepassword-token",
        "1password/op-credentials": "vaults/materia/items/op-credentials",
        "argocd/argocd-github-app": "vaults/ct5helkweamxgoqur2sfafw43u/items/bvyvg4wzv2s4k53ghnfebufzsa",
        "argocd/argocd-notifications-secret": "vaults/materia/items/argocd-notifications-secret",
        "argocd/argocd-redis": "vaults/materia/items/argocd-redis",
        "argocd/argocd-secret": "vaults/materia/items/argocd-secret",
        "authentik/authentik": "vaults/materia/items/authentik-secrets",
        "cert-manager/cloudflare-api-token-secret": "vaults/materia/items/certbot-cloudflare",
        "cloudflare-ddns/cloudflare-ddns-apitoken": "vaults/materia/items/cloudflare-ddns",
        "cosense-cli-mcp/cosense-cli-mcp-secrets": "vaults/materia/items/cosense-cli-mcp-secrets",
        "docker-registry-secrets/ghcr-credentials": "vaults/materia/items/ghcr-credentials",
        "external-dns/cloudflare-api-key": "vaults/materia/items/external-dns-secrets",
        "grafana/grafana-secrets": "vaults/materia/items/grafana-secrets",
        "mackerel-operator/mackerel-apikey": "vaults/materia/items/mackerel-operator-apikey",
        "mahiron/mackerel-apikey": "vaults/materia/items/mackerel-apikey",
        "mahiron/mahiron-config": "vaults/materia/items/mahiron-config",
        "mahiron/pix-smb400-gateway-auth": "vaults/materia/items/pix-smb400-gateway-auth",
        "mastodon/mastodon-secrets": "vaults/materia/items/mastodon-secrets",
        "miniflux/miniflux-secrets": "vaults/materia/items/miniflux-secrets",
        "mirakurun/mackerel-apikey": "vaults/materia/items/mackerel-apikey",
        "mirakurun/mirakurun-config": "vaults/materia/items/mirakurun-config",
        "monitoring/mackerel-apikey": "vaults/materia/items/mackerel-apikey",
        "otel-external/mackerel-apikey": "vaults/materia/items/mackerel-apikey",
        "otel-external/otelcol-external-token": "vaults/materia/items/otelcol-external-token",
        "sophie/sophie-secrets": "vaults/materia/items/sophie-secrets",
        "switchbot-meter-exporter/switchbot-token": "vaults/materia/items/switchbot-token",
        "synology-csi/client-info-secret": "vaults/materia/items/synology-csi-client-info",
        "tailscale/operator-oauth": "vaults/materia/items/tailscale-operator-oauth"
      }
  - name: key
    expression: object.metadata.namespace + '/' + object.metadata.name
  - name: annotations
    expression: 'has(object.metadata.annotations) ? object.metadata.annotations :
      {}'
  - name: oldAnnotations
    expression: 'oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations
      : {}'
  validations:
  - expression: "!variables.annotations.exists(k, k in ['operator.1password.io/item-path',
      'operator.1password.io/item-name', 'operator.1password.io/item-version']) ||
      (variables.key in variables.references && (request.userInfo.username == 'system:serviceaccount:1password:onepassword-connect-operator'
      || (oldObject != null && ['operator.1password.io/item-path', 'operator.1password.io/item-name',
      'operator.1password.io/item-version'].all(k, (k in variables.annotations) ==
      (k in variables.oldAnnotations) && (!(k in variables.annotations) || variables.annotations[k]
      == variables.oldAnnotations[k])))))"
    message: 1Password Secret reference annotations require an approved target and
      may only be set by the Operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: onepassword-secret-references
spec:
  policyName: onepassword-secret-references
  validationActions:
  - Deny
