---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: onepassword-secret-references
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  variables:
  - name: references
    expression: |-
      {
        "argocd/argocd-github-app": "vaults/materia-system/items/argocd-github-app",
        "argocd/argocd-notifications-secret": "vaults/materia-system/items/argocd-notifications-secret",
        "argocd/argocd-redis": "vaults/materia-system/items/argocd-redis",
        "argocd/argocd-secret": "vaults/materia-system/items/argocd-secret",
        "authentik/authentik": "vaults/materia-system/items/authentik-secrets",
        "cert-manager/cloudflare-api-token-secret": "vaults/materia-system/items/certbot-cloudflare",
        "cloudflare-ddns/cloudflare-ddns-apitoken": "vaults/materia-system/items/cloudflare-ddns",
        "cosense-cli-mcp/cosense-cli-mcp-secrets": "vaults/materia-applications/items/cosense-cli-mcp-secrets",
        "docker-registry-secrets/ghcr-credentials": "vaults/materia-system/items/ghcr-credentials",
        "external-dns/cloudflare-api-key": "vaults/materia-system/items/external-dns-secrets",
        "grafana/grafana-secrets": "vaults/materia-applications/items/grafana-secrets",
        "grafana/grafana-image-renderer-token": "vaults/materia-applications/items/grafana-image-renderer-token",
        "grafana/flow-reader": "vaults/materia-applications/items/mph3l536rnjqnx5cgepcfovcfu",
        "network-flows/flow-reader": "vaults/materia-applications/items/mph3l536rnjqnx5cgepcfovcfu",
        "mackerel-operator/mackerel-apikey": "vaults/materia-system/items/mackerel-operator-apikey",
        "mahiron/mackerel-apikey": "vaults/materia-applications/items/mackerel-apikey",
        "mahiron/pix-smb400-gateway-auth": "vaults/materia-applications/items/pix-smb400-gateway-auth",
        "mastodon/mastodon-secrets": "vaults/materia-applications/items/mastodon-secrets",
        "miniflux/miniflux-secrets": "vaults/materia-applications/items/miniflux-secrets",
        "mirakurun/mackerel-apikey": "vaults/materia-applications/items/mackerel-apikey",
        "monitoring/mackerel-apikey": "vaults/materia-system/items/mackerel-apikey",
        "otel-external/mackerel-apikey": "vaults/materia-applications/items/mackerel-apikey",
        "otel-external/otelcol-external-token": "vaults/materia-applications/items/otelcol-external-token",
        "sophie/mackerel-apikey": "vaults/materia-applications/items/mackerel-apikey",
        "sophie/sophie-secrets": "vaults/materia-applications/items/sophie-secrets",
        "synology-csi/client-info-secret": "vaults/materia-system/items/synology-csi-client-info",
        "tailscale/operator-oauth": "vaults/materia-system/items/tailscale-operator-oauth",
        "1password/op-credentials-system": "vaults/materia-system/items/onepassword-system-credentials",
        "1password/onepassword-token-system": "vaults/materia-system/items/onepassword-system-token",
        "1password-applications/op-credentials": "vaults/materia-system/items/onepassword-applications-credentials",
        "1password-applications/onepassword-token": "vaults/materia-system/items/onepassword-applications-token"
      }
  - name: key
    expression: object.metadata.namespace + '/' + object.metadata.name
  - name: annotations
    expression: 'has(object.metadata.annotations) ? object.metadata.annotations :
      {}'
  - name: oldAnnotations
    expression: 'oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations
      : {}'
  - name: owners
    expression: |-
      {
        "argocd/argocd-github-app": "system:serviceaccount:1password:onepassword-connect-operator",
        "argocd/argocd-notifications-secret": "system:serviceaccount:1password:onepassword-connect-operator",
        "argocd/argocd-redis": "system:serviceaccount:1password:onepassword-connect-operator",
        "argocd/argocd-secret": "system:serviceaccount:1password:onepassword-connect-operator",
        "authentik/authentik": "system:serviceaccount:1password:onepassword-connect-operator",
        "cert-manager/cloudflare-api-token-secret": "system:serviceaccount:1password:onepassword-connect-operator",
        "cloudflare-ddns/cloudflare-ddns-apitoken": "system:serviceaccount:1password:onepassword-connect-operator",
        "cosense-cli-mcp/cosense-cli-mcp-secrets": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "docker-registry-secrets/ghcr-credentials": "system:serviceaccount:1password:onepassword-connect-operator",
        "external-dns/cloudflare-api-key": "system:serviceaccount:1password:onepassword-connect-operator",
        "grafana/grafana-secrets": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "grafana/grafana-image-renderer-token": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "grafana/flow-reader": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "network-flows/flow-reader": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "mackerel-operator/mackerel-apikey": "system:serviceaccount:1password:onepassword-connect-operator",
        "mahiron/mackerel-apikey": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "mahiron/pix-smb400-gateway-auth": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "mastodon/mastodon-secrets": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "miniflux/miniflux-secrets": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "mirakurun/mackerel-apikey": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "monitoring/mackerel-apikey": "system:serviceaccount:1password:onepassword-connect-operator",
        "otel-external/mackerel-apikey": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "otel-external/otelcol-external-token": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "sophie/mackerel-apikey": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "sophie/sophie-secrets": "system:serviceaccount:1password-applications:onepassword-connect-operator",
        "synology-csi/client-info-secret": "system:serviceaccount:1password:onepassword-connect-operator",
        "tailscale/operator-oauth": "system:serviceaccount:1password:onepassword-connect-operator",
        "1password/op-credentials-system": "system:serviceaccount:1password:onepassword-connect-operator",
        "1password/onepassword-token-system": "system:serviceaccount:1password:onepassword-connect-operator",
        "1password-applications/op-credentials": "system:serviceaccount:1password:onepassword-connect-operator",
        "1password-applications/onepassword-token": "system:serviceaccount:1password:onepassword-connect-operator"
      }
  - name: isOperator
    expression: request.userInfo.username in ['system:serviceaccount:1password:onepassword-connect-operator',
      'system:serviceaccount:1password-applications:onepassword-connect-operator']
  - name: isOwner
    expression: variables.key in variables.owners && request.userInfo.username ==
      variables.owners[variables.key]
  validations:
  - expression: "!variables.isOperator || (variables.isOwner && (!has(object.type)
      || object.type != 'kubernetes.io/service-account-token'))"
    message: 1Password Operator may only write approved Secret targets and cannot
      issue ServiceAccount tokens
  - expression: "!variables.annotations.exists(k, k in ['operator.1password.io/item-path',
      'operator.1password.io/item-name', 'operator.1password.io/item-version']) ||
      (variables.key in variables.references && (variables.isOwner || (oldObject !=
      null && ['operator.1password.io/item-path', 'operator.1password.io/item-name',
      'operator.1password.io/item-version'].all(k, (k in variables.annotations) ==
      (k in variables.oldAnnotations) && (!(k in variables.annotations) || variables.annotations[k]
      == variables.oldAnnotations[k])))))"
    message: 1Password Secret reference annotations require an approved target and
      may only be set by the Operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: onepassword-secret-references
spec:
  policyName: onepassword-secret-references
  validationActions:
  - Deny
