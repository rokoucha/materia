---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- "./upstream"
- "./resources/scoped-rbac.yaml"
- "./resources/network-policy.yaml"
- "./resources/namespace.yaml"
- "./resources/onepassword-item-references.yaml"
- "./resources/onepassword-no-deployment-references.yaml"
- "./resources/onepassword-secret-references.yaml"
- "./resources/bootstrap-items.yaml"
patches:
- target:
    kind: ClusterRole
    name: onepassword-connect-operator
  patch: |-
    - op: replace
      path: /rules
      value:
        - apiGroups: [""]
          resources: [namespaces]
          resourceNames: ["1password", "1password-applications", "argocd", "authentik", "cert-manager", "cloudflare-ddns", "docker-registry-secrets", "external-dns", "mackerel-operator", "monitoring", "synology-csi", "tailscale"]
          verbs: [get]
- target:
    kind: Deployment
    name: onepassword-connect-operator
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: onepassword-connect-operator
    spec:
      template:
        spec:
          containers:
            - name: onepassword-connect
              env:
                - name: WATCH_NAMESPACE
                  value: 1password,1password-applications,argocd,authentik,cert-manager,cloudflare-ddns,docker-registry-secrets,external-dns,mackerel-operator,monitoring,synology-csi,tailscale
