apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./upstream
  - ./resources/scoped-rbac.yaml
  - ./resources/network-policy.yaml
  - ./resources/mackerel-apikey.yaml
  - ./resources/namespace.yaml

patches:
  - target:
      kind: Deployment|Role|RoleBinding|ServiceAccount
      labelSelector: app.kubernetes.io/instance=mackerel-operator
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mackerel-operator
