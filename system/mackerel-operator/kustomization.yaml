apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./upstream
  - ./resources/scoped-rbac.yaml
  - ./resources/network-policy.yaml
  - ./resources/mackerel-apikey.yaml
  - ./resources/namespace.yaml

patches:
  - target:
      kind: Deployment|Role|RoleBinding|ServiceAccount
      labelSelector: app.kubernetes.io/instance=mackerel-operator
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mackerel-operator
  - target:
      kind: ClusterRole
      name: mackerel-operator-manager
    patch: |-
      - op: replace
        path: /rules
        value:
          - apiGroups: [mackerel.starry.blue]
            resources: [externalmonitors]
            verbs: [get, list, watch]
          - apiGroups: [""]
            resources: [secrets]
            verbs: [list, watch]
  - target:
      kind: Role
      name: mackerel-operator-leader-election
    patch: |-
      - op: replace
        path: /rules
        value:
          - apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [""]
            resources: [events]
            verbs: [create, patch]
  - target:
      kind: ClusterRole
      name: mackerel-operator-manager
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: mackerel-operator-manager
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      kind: Deployment
      name: mackerel-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --disable-secret-watch

images:
  - name: ghcr.io/slashnephy/mackerel-operator
    newName: ghcr.io/rokoucha/mackerel-operator
    digest: sha256:38882298ce39788e7cf58330aa43ee9e2ae1cee65f235b9ec355c8c6dca49621
