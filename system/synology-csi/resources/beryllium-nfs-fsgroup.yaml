apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: beryllium-nfs-fsgroup
provisioner: csi.san.synology.com
parameters:
  dsm: 172.16.2.17
  location: /volume1
  protocol: nfs
  # Let kubelet manage fsGroup. CSI's default 0750 defeats OnRootMismatch.
  mountPermissions: "0"
mountOptions:
  - nfsvers=4.1
reclaimPolicy: Retain
allowVolumeExpansion: true
