esphome:
  name: stamp-pico
  friendly_name: Stamp Pico

esp32:
  board: m5stamp-pico
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 172.16.4.12
    gateway: 172.16.4.1
    subnet: 255.255.255.0
    dns1: 172.16.4.1

logger:
  # GPIO1/3 are used by the MH-Z19C.
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: Temperature
    humidity:
      name: Humidity
    pressure:
      name: Pressure
    update_interval: 60s
  - platform: mhz19
    automatic_baseline_calibration: false
    co2:
      name: CO2
    update_interval: 60s
