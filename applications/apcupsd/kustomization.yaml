apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apcupsd

resources:
  - ./resources/network-policy.yaml
  - resources/namespace.yaml
  - resources/configmap.yaml
  - resources/apcupsd.yaml
  - resources/service.yaml
  - resources/apcupsd-exporter.yaml
  - resources/apcupsd-exporter-service.yaml
  - resources/monitor.yaml

transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: transfer-protection
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    fieldSpecs:
      - kind: Namespace
        path: metadata/annotations
        create: true
      - kind: PersistentVolume
        path: metadata/annotations
        create: true
      - kind: ClusterRole
        path: metadata/annotations
        create: true
      - kind: ClusterRoleBinding
        path: metadata/annotations
        create: true
      - kind: Role
        path: metadata/annotations
        create: true
      - kind: RoleBinding
        path: metadata/annotations
        create: true
