apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nginx

resources:
  - ./resources/deployment.yaml
  - ./resources/external-monitors.yaml
  - ./resources/ggrel-net-tls.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/network-policy.yaml
  - ./resources/noa-pp-ua-tls.yaml
  - ./resources/rokoucha-net-tls.yaml
  - ./resources/sayn-wittgenste-in-tls.yaml
  - ./resources/service.yaml

configMapGenerator:
  - name: config
    files:
      - ./config/nginx.conf

transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: transfer-protection
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    fieldSpecs:
      - kind: Namespace
        path: metadata/annotations
        create: true
      - kind: PersistentVolume
        path: metadata/annotations
        create: true
      - kind: ClusterRole
        path: metadata/annotations
        create: true
      - kind: ClusterRoleBinding
        path: metadata/annotations
        create: true
      - kind: Role
        path: metadata/annotations
        create: true
      - kind: RoleBinding
        path: metadata/annotations
        create: true
