apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: collector
        - podSelector:
            matchLabels:
              app: retention
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgresql
      ports:
        - port: 5432
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 5432
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sflow
spec:
  podSelector:
    matchLabels:
      app: collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.16.3.1/32
      ports:
        - port: 6343
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-reader
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 5432
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network-flows
            k8s:cnpg.io/cluster: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: asn-download
spec:
  endpointSelector:
    matchLabels:
      k8s:app: collector
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toFQDNs:
        - matchName: iptoasn.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sflow-node-forwarding
spec:
  endpointSelector:
    matchLabels:
      k8s:app: collector
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # Tunnel forwarding retains world identity after SNAT to CiliumInternalIP.
    # Keep these /32s aligned with CiliumNode addresses when rebuilding nodes.
    - fromCIDR:
        - 10.244.2.81/32
        - 10.244.1.182/32
        - 10.244.0.181/32
      toPorts:
        - ports:
            - port: "6343"
              protocol: UDP
