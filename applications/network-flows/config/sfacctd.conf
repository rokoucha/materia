daemonize: false
sfacctd_ip: 0.0.0.0
sfacctd_port: 6343
sfacctd_renormalize: true
sfacctd_as: file
networks_file: /maps/networks.lst
maps_refresh: true
propagate_signals: true
pidfile: /maps/sfacctd.pid
pre_tag_map: /etc/pmacct/direction.map
plugins: pgsql[upload], pgsql[download]
aggregate[upload]: vlan, src_mac, src_host, dst_host, dst_as, dst_port, proto
aggregate[download]: vlan, dst_mac, dst_host, src_host, src_as, src_port, proto
pre_tag_filter[upload]: 1
pre_tag_filter[download]: 2
sql_host: postgresql-rw
sql_db: flows
sql_user: flows
sql_table[upload]: upload
sql_table[download]: download
sql_table_version: 9
sql_optimize_clauses: true
sql_history: 1m
sql_history_roundoff: m
sql_refresh_time: 60
sql_dont_try_update: true
sql_cache_entries: 65536
