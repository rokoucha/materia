apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment
  labels:
    app: default

spec:
  replicas: 1
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 998
        seccompProfile:
          type: RuntimeDefault
      containers:
        - args:
            - --port
            - "8888"
          image: ghcr.io/rokoucha/switchbot-meter-exporter:latest
          name: switchbot-meter-exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8888
          envFrom:
            - secretRef:
                name: switchbot-token
