apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: influxdb

spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/library/influxdb:2.9.1-alpine
          name: influxdb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: INFLUXD_REPORTING_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8086
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      restartPolicy: Always
