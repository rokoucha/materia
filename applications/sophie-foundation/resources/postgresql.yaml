apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-minimal-trixie
  instances: 1
  # Single instance: a PDB could only ever block eviction outright, which
  # stops node drains and rebalancing. Accept the restart instead.
  enablePDB: false
  bootstrap:
    initdb:
      database: sophie
  postgresql:
    parameters:
      # Setting a pg_stat_statements option makes CloudNativePG preload and
      # create the managed extension in every connectable database.
      pg_stat_statements.track: all
      compute_query_id: "on"
      log_min_duration_statement: 1s
      log_lock_waits: "on"
      deadlock_timeout: 1s
      # Query text remains useful while bind values stay out of logs.
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
  storage:
    storageClass: beryllium-nfs
    size: 10Gi
