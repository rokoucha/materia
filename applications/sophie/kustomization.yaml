  - ./resources/deployment-server.yaml
  - ./resources/deployment-worker-media.yaml
  - ./resources/deployment-worker-ml-cpu.yaml
  - ./resources/deployment-worker-ml-gpu.yaml
  - ./resources/deployment-web.yaml
