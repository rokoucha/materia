apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sophie

resources:
  - ./resources/deployment-server.yaml
  - ./resources/deployment-web.yaml
  - ./resources/elasticsearch.yaml
  - ./resources/ingress.yaml
  - ./resources/job-migration.yaml
  - ./resources/namespace.yaml
  - ./resources/postgresql.yaml
  - ./resources/redis.yaml
  - ./resources/secrets.yaml
  - ./resources/service-server.yaml
  - ./resources/service-web.yaml
  - ./resources/tls.yaml

configMapGenerator:
  - name: config
    envs:
      - ./config/config.env
