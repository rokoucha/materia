apiVersion: batch/v1
kind: Job

metadata:
  name: model-preparation
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"

spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      restartPolicy: Never
      containers:
        - name: prepare
          image: ghcr.io/rokoucha/sophie-worker-ml:20260919.215554
          command:
            - python3
            - /opt/sophie-ml/model_cache.py
          env:
            - name: ML_THREADS
              value: "2"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: models
              mountPath: /opt/sophie-models
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ml-models
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
