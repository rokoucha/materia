apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-ml-gpu
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sophie-worker-ml-gpu
  template:
    metadata:
      labels:
        app: sophie-worker-ml-gpu
    spec:
      nodeSelector:
        kubernetes.io/hostname: phosphorus
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/rokoucha/sophie-worker-ml:20260919.232300
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: uri
            - name: ML_EXECUTION_PROFILE
              value: gpu
            - name: OTEL_SERVICE_NAME
              value: sophie/worker-ml-gpu
            - name: SOPHIE_ROLE
              value: worker-ml
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: sophie-secrets
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              ephemeral-storage: 512Mi
              memory: 512Mi
            limits:
              cpu: "1"
              ephemeral-storage: 1Gi
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: model-callee
          image: ghcr.io/rokoucha/sophie-worker-ml:20260919.232300
          command:
            - python3
            - /opt/sophie-ml/image_feature_callee.py
          env:
            - name: ML_EXECUTION_PROFILE
              value: gpu
            - name: ML_THREADS
              value: "2"
          resources:
            requests:
              cpu: "1"
              ephemeral-storage: 512Mi
              gpu.intel.com/i915: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              ephemeral-storage: 1Gi
              gpu.intel.com/i915: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /opt/sophie-models
              readOnly: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ml-models
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
