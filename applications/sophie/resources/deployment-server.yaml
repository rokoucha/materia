apiVersion: apps/v1
kind: Deployment

metadata:
  name: server
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: sophie-server
  template:
    metadata:
      labels:
        app: sophie-server
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: server
          image: ghcr.io/rokoucha/sophie-server:20260731.122336
          command: ["node", "dist/src/main.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: uri
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: sophie-secrets
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
