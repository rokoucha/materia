apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-media
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sophie-worker-media
  template:
    metadata:
      labels:
        app: sophie-worker-media
    spec:
      terminationGracePeriodSeconds: 900
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/rokoucha/sophie-worker-media:20260924.132155
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: uri
            - name: OTEL_SERVICE_NAME
              value: sophie/worker-media
            - name: SOPHIE_ROLE
              value: worker-media
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: sophie-secrets
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              ephemeral-storage: 256Mi
              memory: 512Mi
            limits:
              cpu: "1"
              ephemeral-storage: 1Gi
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
