apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - ./network-policy.yaml
  - ./resources/namespace.yaml
  - ./resources/prometheus-persistent-volume-claim.yaml
  - ./resources/prometheus-persistent-volume.yaml
  - ./resources/prometheus.yaml

transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: transfer-protection
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    fieldSpecs:
      - kind: Namespace
        path: metadata/annotations
        create: true
      - kind: PersistentVolume
        path: metadata/annotations
        create: true
      - kind: ClusterRole
        path: metadata/annotations
        create: true
      - kind: ClusterRoleBinding
        path: metadata/annotations
        create: true
      - kind: Role
        path: metadata/annotations
        create: true
      - kind: RoleBinding
        path: metadata/annotations
        create: true
