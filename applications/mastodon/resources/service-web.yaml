apiVersion: v1
kind: Service

metadata:
  name: mastodon-web

spec:
  selector:
    app: web
  type: ClusterIP
  ipFamilies:
    - IPv4
  # Keep proxy source IPs within TRUSTED_PROXY_IP across PD changes.
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 3000
      targetPort: 3000
