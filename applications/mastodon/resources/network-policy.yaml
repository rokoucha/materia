apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch
spec:
  podSelector:
    matchLabels:
      elasticsearch.k8s.elastic.co/cluster-name: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - web
                  - sidekiq
                  - maintenance
                  - elastic-exporter
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: mastodon-deploy-search
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: elastic-operator
              app.kubernetes.io/instance: elastic-operator
      ports:
        - port: 9200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              elasticsearch.k8s.elastic.co/cluster-name: elasticsearch
      ports:
        - port: 9300
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
