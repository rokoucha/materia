apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: elasticsearch-data-elasticsearch-es-default-0

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: beryllium-nfs-sync
  volumeMode: Filesystem
  volumeName: mastodon-elasticsearch-nfs
