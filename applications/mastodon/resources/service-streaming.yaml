apiVersion: v1
kind: Service

metadata:
  name: mastodon-streaming-ipv6
  annotations:
    haproxy.org/backend-config-snippet: |
      timeout http-keep-alive 70s

spec:
  selector:
    app: streaming
  type: ClusterIP
  ipFamilies:
    - IPv6
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 4000
      targetPort: 4000
