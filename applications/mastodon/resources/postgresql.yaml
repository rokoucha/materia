apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: postgresql

spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-minimal-trixie
  instances: 1
  # Single instance: a PDB could only ever block eviction outright, which
  # stops node drains and rebalancing. Accept the restart instead.
  enablePDB: false
  postgresql:
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  bootstrap:
    initdb:
      database: mastodon
  storage:
    storageClass: beryllium-iscsi
    size: 10Gi
