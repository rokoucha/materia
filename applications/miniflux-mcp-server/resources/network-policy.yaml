apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: miniflux-mcp-server
spec:
  podSelector:
    matchLabels:
      app: miniflux-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haproxy-controller
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: haproxy-ingress
              app.kubernetes.io/name: kubernetes-ingress
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miniflux-mcp-server-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:app: miniflux-mcp-server
  enableDefaultDeny:
    ingress: false
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            k8s:app: default
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
