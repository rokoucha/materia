apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosense-cli-mcp
spec:
  podSelector:
    matchLabels:
      app: cosense-cli-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haproxy-controller
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: haproxy-ingress
              app.kubernetes.io/name: kubernetes-ingress
      ports:
        - port: 3000
          protocol: TCP
