apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cosense-cli-mcp-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:app: cosense-cli-mcp
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: scrapbox.io
        - matchName: storage.googleapis.com
        - matchName: api.gyazo.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
