apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mahiron
spec:
  podSelector:
    matchLabels:
      app: mahiron
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haproxy-controller
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-ingress
              app.kubernetes.io/instance: haproxy-ingress
      ports:
        - port: 40772
          protocol: TCP
