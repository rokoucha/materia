apiVersion: apps/v1
kind: Deployment

metadata:
  name: pix-smb400-gateway

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pix-smb400-gateway
  template:
    metadata:
      labels:
        app: pix-smb400-gateway
    spec:
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.5
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: pix-smb400-gateway-auth
                  key: TS_AUTHKEY
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: materia-pix-smb400-gateway
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: --shields-up
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: 127.0.0.1:1055
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
        - name: relay
          image: alpine/socat:1.8.1.3
          command:
            - socat
          args:
            - TCP-LISTEN:40772,fork,reuseaddr
            - PROXY:127.0.0.1:pix-smb400.tail3fe75.ts.net:40772,proxyport=1055
          ports:
            - name: tcp
              containerPort: 40772
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pix-smb400-gateway-state
