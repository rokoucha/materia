apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

helmCharts:
  - name: grafana
    releaseName: grafana
    namespace: grafana
    version: 10.5.15
    repo: https://grafana.github.io/helm-charts
    valuesFile: ./values.yaml

resources:
  - ./resources/grafana-secrets.yaml
  - ./resources/renderer-token.yaml
  - ./resources/flow-reader.yaml
  - ./resources/network-policy.yaml
  - ./resources/persistent-volume-claim.yaml
  - ./resources/tls.yaml

# Imported dashboards exceed the client-side apply annotation limit.
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

configMapGenerator:
  - name: dashboards-apc-rs-550va
    files:
      - dashboards/apc-rs-550va.json
  - name: dashboards-argo-cd
    files:
      - dashboards/argo-cd.json
      - dashboards/existing/redis-argo-cd.json
  - name: dashboards-authentik
    files:
      - dashboards/authentik.json
  - name: dashboards-cilium
    files:
      - dashboards/cilium.json
  - name: dashboards-mahiron
    files:
      - dashboards/mahiron.json
  - name: dashboards-materia-cluster
    files:
      - dashboards/materia-cluster.json
      - dashboards/existing/node-exporter-full.json
      - dashboards/existing/cert-manager.json
      - dashboards/existing/coredns.json
  - name: dashboards-opentelemetry-collector
    files:
      - dashboards/opentelemetry-collector.json
  - name: dashboards-sophie
    files:
      - dashboards/sophie.json
  - name: dashboards-mastodon
    files:
      - dashboards/existing/redis-mastodon.json
  - name: network-flows-dashboard
    files:
      - dashboards/network-flows.json
  - name: config
    envs:
      - ./config/config.env

patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: grafana
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: grafana
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: grafana-clusterrole
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: grafana-clusterrole
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: grafana
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: grafana
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: grafana-clusterrolebinding
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: grafana-clusterrolebinding
      $patch: delete
