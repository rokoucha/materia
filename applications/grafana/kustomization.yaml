apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

helmCharts:
  - name: grafana
    releaseName: grafana
    namespace: grafana
    version: 10.5.15
    repo: https://grafana.github.io/helm-charts
    valuesFile: ./values.yaml

resources:
  - ./resources/grafana-secrets.yaml
  - ./resources/namespace.yaml
  - ./resources/network-policy.yaml
  - ./resources/persistent-volume-claim.yaml
  - ./resources/tls.yaml

configMapGenerator:
  - name: config
    envs:
      - ./config/config.env

transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: transfer-protection
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    fieldSpecs:
      - kind: Namespace
        path: metadata/annotations
        create: true
      - kind: PersistentVolume
        path: metadata/annotations
        create: true
      - kind: ClusterRole
        path: metadata/annotations
        create: true
      - kind: ClusterRoleBinding
        path: metadata/annotations
        create: true
      - kind: Role
        path: metadata/annotations
        create: true
      - kind: RoleBinding
        path: metadata/annotations
        create: true
