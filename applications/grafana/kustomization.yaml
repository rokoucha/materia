apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

helmCharts:
  - name: grafana
    releaseName: grafana
    namespace: grafana
    version: 10.5.15
    repo: https://grafana.github.io/helm-charts
    valuesFile: ./values.yaml

resources:
  - ./resources/grafana-secrets.yaml
  - ./resources/flow-reader.yaml
  - ./resources/network-policy.yaml
  - ./resources/persistent-volume-claim.yaml
  - ./resources/tls.yaml

configMapGenerator:
  - name: network-flows-dashboard
    files:
      - dashboards/network-flows.json
  - name: config
    envs:
      - ./config/config.env

patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: grafana
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: grafana
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: grafana-clusterrole
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: grafana-clusterrole
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: grafana
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: grafana
      $patch: delete
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: grafana-clusterrolebinding
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: grafana-clusterrolebinding
      $patch: delete
