image:
  tag: "13.1.0"

deploymentStrategy:
  type: Recreate

annotations:
  argocd.argoproj.io/sync-options: Replace=true

env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6

ingress:
  enabled: true
  ingressClassName: haproxy
  hosts:
    - monitor.ggrel.net
  tls:
    - secretName: tls
      hosts:
        - monitor.ggrel.net

resources:
  requests:
    cpu: 250m
    memory: 750Mi

# The existing PVC is owned and writable by Grafana's UID/GID 472.
initChownData:
  enabled: false

persistence:
  enabled: true
  existingClaim: data

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Network flows
        uid: network-flows
        type: grafana-postgresql-datasource
        access: proxy
        url: postgresql-rw.network-flows.svc.materia-cluster.ggrel.net:5432
        user: flow_reader
        secureJsonData:
          password: $FLOW_READER_PASSWORD
        jsonData:
          database: flows
          sslmode: require
          postgresVersion: 1800
          maxOpenConns: 3
          maxIdleConns: 1
          timescaledb: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc.materia-cluster.ggrel.net
        isDefault: false
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.materia-cluster.ggrel.net:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: service_name
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{service_name="postgresql", service_namespace="sophie"} |= "$${__trace.traceId}"'
            spanStartTimeShift: -15m
            spanEndTimeShift: 15m

envValueFrom:
  GF_RENDERING_RENDERER_TOKEN:
    secretKeyRef:
      name: grafana-image-renderer-token
      key: token

envFromSecrets:
  - name: flow-reader
  - name: grafana-secrets

envFromConfigMaps:
  - name: config

testFramework:
  enabled: false

automountServiceAccountToken: false

plugins:
  - netsage-sankey-panel 1.1.4

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: network-flows
        orgId: 1
        folder: Traffic
        folderUid: bg1w8f1ehfbb4b
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/network-flows

      - name: apc-rs-550va
        orgId: 1
        folder: APC RS 550VA
        folderUid: svc-apc-rs-550va
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/apc-rs-550va
      - name: argo-cd
        orgId: 1
        folder: Argo CD
        folderUid: svc-argo-cd
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/argo-cd
      - name: authentik
        orgId: 1
        folder: Authentik
        folderUid: svc-authentik
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/authentik
      - name: cilium
        orgId: 1
        folder: Cilium
        folderUid: svc-cilium
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/cilium
      - name: mahiron
        orgId: 1
        folder: Mahiron
        folderUid: svc-mahiron
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/mahiron
      - name: materia-cluster
        orgId: 1
        folder: Materia Cluster
        folderUid: svc-materia-cluster
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/materia-cluster
      - name: opentelemetry-collector
        orgId: 1
        folder: OpenTelemetry Collector
        folderUid: svc-opentelemetry-collector
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/opentelemetry-collector
      - name: sophie
        orgId: 1
        folder: Sophie
        folderUid: svc-sophie
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/sophie
      - name: mastodon
        orgId: 1
        folder: Mastodon
        folderUid: svc-mastodon
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/mastodon

dashboardsConfigMaps:
  network-flows: network-flows-dashboard
  apc-rs-550va: dashboards-apc-rs-550va
  argo-cd: dashboards-argo-cd
  authentik: dashboards-authentik
  cilium: dashboards-cilium
  mahiron: dashboards-mahiron
  materia-cluster: dashboards-materia-cluster
  opentelemetry-collector: dashboards-opentelemetry-collector
  sophie: dashboards-sophie
  mastodon: dashboards-mastodon

imageRenderer:
  enabled: true
  image:
    tag: v5.12.7
    pullPolicy: IfNotPresent
  env:
    GOMEMLIMIT: 384MiB
    RATE_LIMIT_MAX_LIMIT: "1"
    RATE_LIMIT_MIN_LIMIT: "1"
  envValueFrom:
    AUTH_TOKEN:
      secretKeyRef:
        name: grafana-image-renderer-token
        key: token
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi
