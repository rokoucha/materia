image:
  tag: "13.1.0"

deploymentStrategy:
  type: Recreate

annotations:
  argocd.argoproj.io/sync-options: Replace=true

env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6

ingress:
  enabled: true
  ingressClassName: haproxy
  hosts:
    - monitor.ggrel.net
  tls:
    - secretName: tls
      hosts:
        - monitor.ggrel.net

resources:
  requests:
    cpu: 250m
    memory: 750Mi

# The existing PVC is owned and writable by Grafana's UID/GID 472.
initChownData:
  enabled: false

persistence:
  enabled: true
  existingClaim: data

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Network flows
        uid: network-flows
        type: grafana-postgresql-datasource
        access: proxy
        url: postgresql-rw.network-flows.svc.materia-cluster.ggrel.net:5432
        user: flow_reader
        secureJsonData:
          password: $FLOW_READER_PASSWORD
        jsonData:
          database: flows
          sslmode: require
          postgresVersion: 1800
          maxOpenConns: 3
          maxIdleConns: 1
          timescaledb: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc.materia-cluster.ggrel.net
        isDefault: false
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.materia-cluster.ggrel.net:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: service_name
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{service_name="postgresql", service_namespace="sophie"} |= "$${__trace.traceId}"'
            spanStartTimeShift: -15m
            spanEndTimeShift: 15m

envFromSecrets:
  - name: flow-reader
  - name: grafana-secrets

envFromConfigMaps:
  - name: config

testFramework:
  enabled: false

automountServiceAccountToken: false

plugins:
  - netsage-sankey-panel 1.1.4

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: network-flows
        orgId: 1
        folder: Traffic
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/network-flows

dashboardsConfigMaps:
  network-flows: network-flows-dashboard
