name: Flow enrichment image
on:
  pull_request:
    paths: [applications/network-flows/enrichment/**, .github/workflows/flow-enrichment.yaml]
  push:
    branches: [main]
    paths: [applications/network-flows/enrichment/**, .github/workflows/flow-enrichment.yaml]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ghcr.io/rokoucha/materia/network-flow-enrichment:20261021.1 applications/network-flows/enrichment
      - if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/rokoucha/materia/network-flow-enrichment:20261021.1
