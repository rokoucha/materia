apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../system/cilium
  - ../system/1password-connect
  - ../system/1password-applications
  - ../system/argocd

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: op-credentials-system
    files:
      - ./1password-credentials.json
    namespace: 1password
  - name: onepassword-token-system
    envs:
      - ./1password.env
    namespace: 1password
