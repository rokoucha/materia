apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pd-migration
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
  project: system
  source:
    path: system/pd-migration
    repoURL: https://github.com/rokoucha/materia.git
    targetRevision: HEAD
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: pd-migration-status
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
