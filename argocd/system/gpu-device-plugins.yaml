apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: gpu-device-plugins

spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: system
  source:
    path: system/gpu-device-plugins
    repoURL: https://github.com/rokoucha/materia.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
