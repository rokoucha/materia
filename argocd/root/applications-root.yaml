apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: applications-root

spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: root
  sources:
    - path: argocd/applications
      repoURL: https://github.com/rokoucha/materia.git
      targetRevision: main
    - path: infrastructure/argocd
      repoURL: https://github.com/rokoucha/sophie.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
