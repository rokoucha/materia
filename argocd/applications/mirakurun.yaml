apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: mirakurun

spec:
  destination:
    namespace: mirakurun
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data/.dockerconfigjson
        - /metadata/annotations/reflector.v1.k8s.emberstack.com~1reflected-at
        - /metadata/annotations/reflector.v1.k8s.emberstack.com~1reflected-version
      kind: Secret
      name: ghcr-credentials
    - jsonPointers:
        - /data/tls.crt
        - /data/tls.key
        - /metadata/annotations/reflector.v1.k8s.emberstack.com~1reflected-at
        - /metadata/annotations/reflector.v1.k8s.emberstack.com~1reflected-version
      kind: Secret
      name: tls
  project: applications
  source:
    kustomize:
      patches:
        # The source repository still uses the snippet removed in controller 3.4.
        - target:
            kind: Service
            name: service
          patch: |-
            apiVersion: v1
            kind: Service
            metadata:
              name: service
              annotations:
                haproxy.org/backend-config-snippet: null
                backend.materia.ggrel.net/normalize-rpc-path: "true"
    path: applications/mirakurun
    repoURL: https://github.com/rokoucha/materia-arcanum.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
