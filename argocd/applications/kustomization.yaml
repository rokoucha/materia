apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ./apcupsd.yaml
  - ./cosense-cli-mcp.yaml
  - ./grafana.yaml
  - ./influxdb.yaml
  - ./lb-test.yaml
  - ./loki.yaml
  - ./mahiron.yaml
  - ./mastodon.yaml
  - ./miniflux.yaml
  - ./mirakurun.yaml
  - ./nginx.yaml
  - ./oauth2-proxy.yaml
  - ./otel-external.yaml
  - ./prometheus.yaml
  - ./switchbot-meter-exporter.yaml
  - ./tempo.yaml
  - ./teamspeak.yaml

patches:
  - target:
      kind: Application
    patch: |-
      - op: add
        path: /spec/syncPolicy/syncOptions
        value:
          - ServerSideApply=true
