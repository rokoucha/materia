clusterName: materia-cluster
talosVersion: v1.14.0
kubernetesVersion: v1.36.4

endpoint: https://materia-cluster.ggrel.net:6443

allowSchedulingOnControlPlanes: true

domain: materia-cluster.ggrel.net

additionalApiServerCertSans:
  - materia-cluster.ggrel.net
  - 172.16.2.20

additionalMachineCertSans:
  - materia-cluster.ggrel.net
  - 172.16.2.20
  - hydrogen.dns.ggrel.net
  - lithium.dns.ggrel.net
  - phosphorus.dns.ggrel.net

clusterPodNets:
  - 10.244.0.0/16
  - fd00::/108
clusterSvcNets:
  - 10.96.0.0/12
  - fd01::/108

cniConfig:
  name: none

controlPlane:
  machineSpec:
    mode: metal
    arch: amd64
    secureboot: true
  patches:
    - |-
      machine:
        kernel:
          modules:
            - name: btrfs
        systemDiskEncryption:
          state:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}
          ephemeral:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}

    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
    - |-
      apiVersion: v1alpha1
      kind: KubeAPIServerConfig
      extraArgs:
        service-node-port-range: "80-32767"
    - |-
      apiVersion: v1alpha1
      kind: KubeControllerManagerConfig
      extraArgs:
        allocate-node-cidrs: "false"

nodes:
  - hostname: hydrogen
    schematic: &intelSchematic
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/btrfs
            - siderolabs/i915
            - siderolabs/intel-ucode
            - siderolabs/iscsi-tools
        bootloader: sd-boot
    ipAddress: 172.16.2.21
    controlPlane: true
    installDiskSelector:
      type: nvme
    networkInterfaces:
      - deviceSelector:
          physical: true
        addresses:
          - 172.16.2.21/24
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.2.1
        dhcp: false
        vip:
          ip: 172.16.2.20
        vlans:
          - vlanId: 30
            addresses:
              - 172.16.3.21/24
              - 240b:10:3f6d:1403::21/64
            dhcp: false

  - hostname: lithium
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/amd-ucode
            - siderolabs/amdgpu
            - siderolabs/btrfs
            - siderolabs/iscsi-tools
        bootloader: sd-boot
    ipAddress: 172.16.2.22
    controlPlane: true
    installDiskSelector:
      type: nvme
    networkInterfaces:
      - deviceSelector:
          physical: true
        addresses:
          - 172.16.2.22/24
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.2.1
        dhcp: false
        vip:
          ip: 172.16.2.20
        vlans:
          - vlanId: 30
            addresses:
              - 172.16.3.22/24
              - 240b:10:3f6d:1403::22/64
            dhcp: false

  - hostname: phosphorus
    schematic: *intelSchematic
    ipAddress: 172.16.2.23
    controlPlane: true
    installDiskSelector:
      type: nvme
    networkInterfaces:
      - deviceSelector:
          physical: true
        addresses:
          - 172.16.2.23/24
        routes:
          - network: 0.0.0.0/0
            gateway: 172.16.2.1
        dhcp: false
        vip:
          ip: 172.16.2.20
        vlans:
          - vlanId: 30
            addresses:
              - 172.16.3.23/24
              - 240b:10:3f6d:1403::23/64
            dhcp: false
